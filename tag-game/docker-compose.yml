services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:./data/prod.db
      - JWT_SECRET=${JWT_SECRET:-change-this-secret}
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_MB=4
      - WS_HEARTBEAT=20000
      - MAX_CAPTURE_DISTANCE_METERS=5
      - POSITION_UPDATE_COOLDOWN_SEC=3
      - NEARBY_RADIUS_METERS=15
    volumes:
      - api_data:/app/data
      - api_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/users/me", "||", "exit", "1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '80:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api_data:
  api_uploads:
