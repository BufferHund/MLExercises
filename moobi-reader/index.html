<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moobi Reader - 电子书阅读器</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- JSZip Library (required for EPUB.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- EPUB.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <!-- Welcome Screen -->
    <div id="welcomeScreen" class="screen active">
        <div class="glass-container welcome-container">
            <div class="logo-section">
                <div class="app-icon">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <rect x="20" y="15" width="60" height="70" rx="8" fill="none" stroke="currentColor" stroke-width="3"/>
                        <line x1="35" y1="30" x2="65" y2="30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                        <line x1="35" y1="42" x2="65" y2="42" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                        <line x1="35" y1="54" x2="55" y2="54" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <h1 class="app-title">Moobi Reader</h1>
                <p class="app-subtitle">现代化电子书阅读体验</p>
            </div>

            <div class="upload-section">
                <label for="fileInput" class="upload-button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <span>选择文件</span>
                </label>
                <input type="file" id="fileInput" accept=".epub,.pdf" hidden>
                <p class="supported-formats">支持 EPUB 和 PDF 格式</p>
            </div>

            <div class="recent-files" id="recentFiles">
                <!-- Recent files will be dynamically added here -->
            </div>
        </div>
    </div>

    <!-- Reader Screen -->
    <div id="readerScreen" class="screen">
        <!-- Top Bar -->
        <div class="top-bar glass-panel">
            <button class="icon-button back-button" id="backButton">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>

            <div class="book-info">
                <h2 class="book-title" id="bookTitle">书名</h2>
                <p class="book-author" id="bookAuthor">作者</p>
            </div>

            <button class="icon-button settings-button" id="settingsButton">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v6m0 6v6M1 12h6m6 0h6"/>
                </svg>
            </button>
        </div>

        <!-- Reader Content -->
        <div class="reader-content" id="readerContent">
            <!-- EPUB Viewer -->
            <div id="epubViewer" class="viewer" style="display: none;">
                <div id="epubArea"></div>
            </div>

            <!-- PDF Viewer -->
            <div id="pdfViewer" class="viewer" style="display: none;">
                <canvas id="pdfCanvas"></canvas>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="bottom-bar glass-panel">
            <button class="icon-button" id="prevButton">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </button>

            <div class="progress-container">
                <input type="range" class="progress-slider" id="progressSlider" min="0" max="100" value="0">
                <div class="progress-info">
                    <span id="currentPage">0</span> / <span id="totalPages">0</span>
                </div>
            </div>

            <button class="icon-button" id="nextButton">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="9 18 15 12 9 6"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel glass-panel" id="settingsPanel">
        <div class="settings-header">
            <h3>阅读设置</h3>
            <button class="icon-button close-settings" id="closeSettings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <div class="settings-content">
            <div class="setting-group">
                <label>字体大小</label>
                <div class="slider-control">
                    <span>A-</span>
                    <input type="range" id="fontSizeSlider" min="12" max="28" value="16" step="2">
                    <span>A+</span>
                </div>
            </div>

            <div class="setting-group">
                <label>主题</label>
                <div class="theme-selector">
                    <button class="theme-option" data-theme="light">浅色</button>
                    <button class="theme-option active" data-theme="dark">深色</button>
                    <button class="theme-option" data-theme="sepia">护眼</button>
                </div>
            </div>

            <div class="setting-group">
                <label>行间距</label>
                <div class="slider-control">
                    <input type="range" id="lineHeightSlider" min="1.2" max="2.2" value="1.6" step="0.2">
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
